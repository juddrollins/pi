name: Build & Push from Pi
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: [self-hosted]   # your runner’s labels
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push (native ARM64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
          platforms: linux/arm64

      - name: Stop and remove old container
        run: |
          docker stop pi-app || true
          docker rm pi-app || true

      - name: Pull and run new container
        run: |
          docker pull ghcr.io/${{ github.repository }}:latest
          docker run -d \
            --name pi-app \
            --restart unless-stopped \
            -p 8080:8080 \
            -v pi-app-data:/app/data \
            ghcr.io/${{ github.repository }}:latest
      
      - name: Verify deployment
        run: |
          sleep 5
          docker ps | grep pi-app
          docker logs --tail 20 pi-app
